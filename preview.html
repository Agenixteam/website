<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGENIX Preview</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap">
<style>
  :root{--ink:#1b1640;--muted:#6b6886;--line:#e6e3f0;--bg:#eceaf4;--indigo:#382c78}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column}
  .bar{flex:none;min-height:60px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .bar b{font-size:15px}
  .bar small{color:var(--muted);font-size:13px;margin-left:8px}
  .seg{display:flex;padding:4px;border-radius:14px;background:#f1edfb;gap:4px}
  .seg button{height:40px;padding:0 16px;border:0;border-radius:10px;background:none;color:var(--indigo);font:600 14px Inter,sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--indigo);color:#fff}
  .open{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font:600 13px Inter,sans-serif;display:flex;align-items:center}
  .stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow:auto}
  iframe{display:block;border:0;background:#fff;width:100%;height:100%}
  body.mobile .stage{padding:24px 16px}
  body.mobile iframe{width:390px;max-width:100%;height:844px;max-height:calc(100vh - 110px);border-radius:28px;box-shadow:0 0 0 10px #1b1640,0 30px 60px -20px rgba(27,22,64,.5)}
</style>
</head>
<body>
<div class="bar">
  <div><b>AGENIX · ตัวอย่างเว็บ</b><small id="size"></small></div>
  <div class="seg" role="group" aria-label="มุมมอง">
    <button type="button" data-view="desktop" aria-pressed="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>หน้าเว็บปกติ</button>
    <button type="button" data-view="mobile" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg>มือถือ</button>
  </div>
  <a class="open" href="index.html" target="_blank" rel="noopener">เปิดเต็มหน้า ↗</a>
</div>
<div class="stage"><iframe id="site" src="index.html" title="AGENIX website"></iframe></div>
<script>
  (function () {
    var btns = document.querySelectorAll('.seg button'), frame = document.getElementById('site'), size = document.getElementById('size');
    function set(view) {
      document.body.classList.toggle('mobile', view === 'mobile');
      btns.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.view === view); });
      if (location.hash !== '#' + view) history.replaceState(null, '', '#' + view);
      try { localStorage.setItem('agenix-preview', view); } catch (e) {}
      requestAnimationFrame(function () { size.textContent = frame.clientWidth + ' px'; });
    }
    btns.forEach(function (b) { b.addEventListener('click', function () { set(b.dataset.view); }); });
    window.addEventListener('resize', function () { size.textContent = frame.clientWidth + ' px'; });
    var saved = null;
    try { saved = localStorage.getItem('agenix-preview'); } catch (e) {}
    set(location.hash === '#mobile' || location.hash === '#desktop' ? location.hash.slice(1) : (saved || 'desktop'));
  })();
</script>
</body>
</html>
